[package]
name = "testenv"
version = "0.0.0"
description = "DinD Swarm test harness for swarm-scheduler-exporter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# integration is Go's integration build tag: it compiles the modules that talk to a Docker daemon
# (the cluster, its bring-up and teardown, the images) and the suite, and testenv-core's context,
# testing, redacting logger and host sweep (its bollard feature implies async and redact;
# redact-go-slog, which the old go-slog RedactingLogger needs, is explicit). Without
# it, only the /metrics text reader builds, and its tests run in a plain cargo test.
[features]
integration = [
    "testenv-core/async",
    "testenv-core/bollard",
    "testenv-core/redact",
    "testenv-core/redact-go-slog",
    "dep:bollard",
    "dep:futures-util",
    "dep:tempfile",
    "dep:tokio",
    "dep:tokio-util",
]

[dependencies]
# The shared crates the exporter itself uses (rust-common), for the harness's own logs, clock
# and Go formatting. testenv does not depend on the exporter crate; the exporter package names
# testenv in no table (the boundary meta-test checks it), so nothing here reaches the shipped
# binary.
# Go's quoting, float and duration formatting and the local zone, as the exporter writes them.
go-compat.workspace = true
# The wall clock the harness and its logs read.
clock.workspace = true
# The exporter's logger, for the harness's own records.
go-slog.workspace = true
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# The generic half of the harness (rust-common): Go's -run filter, the envid, the sweep rules and
# the owner labels, the error type, and (with integration) Go's context and testing packages, the
# redacting logger and the host daemon's sweep and cleanup. Its features follow integration, so a
# plain cargo test does not build bollard.
testenv-core.workspace = true
# The Docker SDK, for the harness only, which creates and removes containers, networks and a
# Swarm on purpose. An optional normal dependency, not a dev-dependency: the suite reaches it
# through this library's API, and a dev-dependency is not available to library code. ring, not
# aws-lc-sys, behind ssl. testenv-core's own entry takes pipe only; http (the nodes' daemons over
# TCP) and ssl are this harness's, and cargo unifies them.
bollard = { version = "=0.21.1", default-features = false, features = [
    "http",
    "pipe",
    "ssl",
], optional = true }
futures-util = { version = "0.3.34", default-features = false, features = [
    "std",
], optional = true }
# The workload image archive, saved once on the host and loaded on every node.
tempfile = { version = "3.27.0", optional = true }
tokio = { version = "1.54.1", default-features = false, features = [
    "fs",
    "io-util",
    "rt",
    "time",
], optional = true }
# io for the workload image archive's byte stream.
tokio-util = { version = "0.7.20", default-features = false, features = ["io"], optional = true }

# The suite's own needs, beside the library's: the exporter child processes, the signal that
# cancels the suite, and the HTTP client and fault proxy (hyper, as the exporter uses it).
[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "signal",
    "sync",
    "time",
] }
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = [
    "tokio",
    "http1",
    "client-legacy",
] }
http-body-util = "0.1.5"
bytes = "1.12.1"
# The daemon's JSON error bodies the socket-proxy test reads.
serde_json = "1.0.154"
# The socket-proxy test's image and variable-name patterns.
regex = "1.13.1"
# The signals the launcher sends the exporter, without unsafe code.
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
harness = false
required-features = ["integration"]
