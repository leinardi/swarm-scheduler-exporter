# commit-msg as well as pre-commit, so that `make pre-commit-install` installs
# the conventional-commit check too: the release version is derived from the
# commit types, so a message that cannot be classified is caught at commit time
# rather than at release time.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      # Fixtures are byte-for-byte captures of another tool's output (the files
      # under internal/collector/testdata are Engine API wire captures and a
      # golden file), and a formatter that tidies them makes them prove
      # something other than what was captured.
      - id: end-of-file-fixer
        exclude: (^|/)testdata/
      - id: trailing-whitespace
        exclude: (^|/)testdata/
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/checkmake/checkmake.git
    rev: v0.3.2
    hooks:
      - id: checkmake
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-shellcheck", "shellcheck -S error"]
      - id: actionlint
        alias: actionlint-oneline
        name: actionlint (one line per one error)
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-oneline", "-shellcheck", "shellcheck -S error"]
        stages: [manual]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        args: ["-x"]
      - id: shellcheck
        alias: shellcheck-diff-output
        name: shellcheck (diff output)
        entry: shellcheck
        language: system
        types: [shell]
        args: ["-f", "diff", "-x"]
        stages: [manual]
      - id: shellcheck
        alias: shellcheck-json-output
        name: shellcheck (json output)
        entry: shellcheck
        language: system
        types: [shell]
        args: ["-f", "json", "-x"]
        stages: [manual]
      - id: prettier-yaml
        name: prettier-yaml
        entry: prettier
        language: node
        additional_dependencies: ["prettier@3.7.4"]
        files: \.(yml|yaml)$
        args: ["--write"]
      # Dependency-change check, and nothing more. It runs the same make target `make audit-deps`
      # runs -- the full source-aware govulncheck scan over every package -- but only when the
      # dependency files themselves change, which is what limits it: it catches a bad upgrade at
      # the moment it is made, and nothing else. It does not catch a CVE disclosed against a
      # dependency nobody touched since, and it never fires on a .go change, so new code reaching
      # an already-vulnerable API goes unseen here. Widening the trigger is not the fix: it would
      # put a network scan on every Go commit. `make audit-deps` is the deliberate run, and the
      # go-vulncheck CI job runs it on every pull request.
      - id: audit-deps-go
        name: go dependency audit
        entry: make audit-deps-go
        language: system
        pass_filenames: false
        require_serial: true
        files: ^go\.(mod|sum)$
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
      - id: yamllint
        alias: yamllint-parsable
        name: "yamllint (parsable output)"
        args: ["--format", "parsable"]
        stages: [manual]
  - repo: https://github.com/docker-compose-linter/pre-commit-dclint
    rev: v3.1.0
    hooks:
      - id: dclint
        language_version: 22.15.0
        files: ^(?:.*/)?(?:docker-)?compose\.ya?ml$
        args: [--fix]
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint-config-verify
      - id: golangci-lint-fmt
      - id: golangci-lint-full
        types: [file]
        files: '(\.go$|^go\.(mod|sum)$|^\.golangci\.(yml|yaml|toml|json)$)'
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-test-repo-mod
  # The release version is derived from the commit types since the last tag, so
  # a message nobody can classify is a release nobody can version. With
  # --force-scope: every commit from now on names a scope, and CONTRIBUTING.md
  # requires one.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["--force-scope"]
