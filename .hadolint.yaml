failure-threshold: style
# DL3049 (a missing label) is only info by default; as an error it fails whatever
# failure-threshold is set to.
override:
  error:
    - DL3049
ignored:
  # Pin versions in apt-get install. The build stage's dhi.io/rust tag is republished with a
  # refreshed package index, which breaks any pin, and nothing it installs ships: each download
  # it makes is checked by its own sha256.
  - DL3008
# The seven OCI labels every image carries, each required (DL3049 when missing) and validated;
# strict-labels rejects any label not listed here.
label-schema:
  org.opencontainers.image.title: text
  org.opencontainers.image.description: text
  org.opencontainers.image.source: url
  org.opencontainers.image.version: text
  org.opencontainers.image.revision: text
  org.opencontainers.image.created: text
  org.opencontainers.image.licenses: spdx
strict-labels: true
