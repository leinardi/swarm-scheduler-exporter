[package]
name = "meta"
version = "0.0.0"
description = "Repository meta-tests for swarm-scheduler-exporter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The repository checks the meta-tests run (repo-meta, rust-common) and the repository root
# (testenv-core's repo_root!, rust-common).
[dependencies]
repo-meta.workspace = true
testenv-core.workspace = true

# The Docker SDK boundary's own rules: the manifests (toml) and the source scans (regex).
[dev-dependencies]
regex = "1.13.1"
toml = "1.1.8"
