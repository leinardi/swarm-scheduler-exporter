[workspace]
# Listed explicitly, never as a glob: meta/tests/workspace_lints.rs checks each member's manifest.
members = [".", "meta", "testenv"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Roberto Leinardi"]
repository = "https://github.com/leinardi/swarm-scheduler-exporter"

# The crates shared with the other Rust services, from leinardi/rust-common: a git dependency
# pinned by commit (`rev = "..."`) while the upstream-stack work is in flight. To move the pin,
# change the `rev` on every rust-common line and run `cargo fetch` (not `cargo update -p`):
# `git diff Cargo.lock` must touch only the rust-common lines. Each member opts in with
# `<name>.workspace = true` and its own features. Local work on both repositories: an uncommitted
# `[patch."https://github.com/leinardi/rust-common"]` table naming each crate with
# `path = "../rust-common/crates/<name>"`.
[workspace.dependencies]
clock = { git = "https://github.com/leinardi/rust-common", rev = "2653891901ba88ac95b07b5ecb93e6adb70aa13c" }
docker-client = { git = "https://github.com/leinardi/rust-common", rev = "2653891901ba88ac95b07b5ecb93e6adb70aa13c" }
repo-meta = { git = "https://github.com/leinardi/rust-common", rev = "2653891901ba88ac95b07b5ecb93e6adb70aa13c" }
service-kit = { git = "https://github.com/leinardi/rust-common", rev = "2653891901ba88ac95b07b5ecb93e6adb70aa13c" }
testenv-core = { git = "https://github.com/leinardi/rust-common", rev = "2653891901ba88ac95b07b5ecb93e6adb70aa13c" }
tracing-setup = { git = "https://github.com/leinardi/rust-common", rev = "2653891901ba88ac95b07b5ecb93e6adb70aa13c" }

# The lint set lives here once. Every member opts in with `[lints] workspace = true` (a member does
# not inherit it otherwise, and the meta crate asserts that each one does), and every clippy run is
# workspace-wide.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Only `#[expect(lint, reason = "...")]` may silence a lint: it fails once the lint stops firing,
# and the reason is mandatory. Every one is counted by scripts/check-suppressions.sh.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# No panics outside tests; clippy.toml allows both in tests.
unwrap_used = "deny"
expect_used = "deny"
# Output goes through the logger, or an explicit writeln! to a handle.
print_stdout = "deny"
print_stderr = "deny"
# A match on an enum names every variant, so a new variant is a compile-time decision everywhere.
wildcard_enum_match_arm = "deny"
# Descriptive names; clippy's default allow-list applies.
min_ident_chars = "deny"
# The wall-clock ban in clippy.toml is only enforced if the lint is.
disallowed_methods = "deny"

# Dependency conventions, for the crates the port adds (S1-S8 spikes):
# - rustls and tokio-rustls with `default-features = false` plus the `ring` feature, which keeps
#   aws-lc-sys (C, hard to cross-build for musl) out of the graph;
# - hyper and hyper-util with only `http1`, `client` or `server`, and the tokio features;
# - tracing, no log bridge: the subscriber is tracing-setup's (rust-common); hyper, hyper-util,
#   tokio and rustls print nothing without a subscriber.

[package]
name = "swarm-scheduler-exporter"
version = "0.0.0"
description = "Prometheus exporter for the Docker Swarm scheduler"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The `--poll-delay` parser and its display (`10s`, `1m 30s`, `500ms`).
humantime = "2.4.0"
# The CIDR of a `node.ip` placement constraint.
ipnet = "2.12.2"
# The injected wall clock (rust-common): Clock, SystemClock, TokioClock, FakeClock.
clock.workspace = true
# The subscriber (rust-common): tracing-subscriber's text or flat JSON, no ANSI, UTC RFC 3339
# timestamps, to stdout; the flags and the writer are here.
tracing-setup.workspace = true
# The logging macros.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The exposition: the registry, the OpenMetrics text encoder, the histogram and the counters.
# No features: the exporter encodes text only (no protobuf, no derive macros).
prometheus-client = { version = "0.25.2", default-features = false }
# The Docker connection (rust-common): bollard behind a unix socket, TCP (`tcp`: DOCKER_HOST) and
# TLS (`tls`: rustls on ring, DOCKER_TLS_VERIFY and DOCKER_CERT_PATH), a fixed or negotiated API
# version, the `User-Agent`, the error kinds and bollard itself (`docker_client::bollard`). No
# `attach`: the exporter only reads (meta/tests/docker_boundary.rs checks it).
docker-client = { workspace = true, features = ["tcp", "tls"] }
# The engine's event stream (`Stream`, `next`) behind the Docker client.
futures-util = { version = "0.3.34", default-features = false }
# The build stamps (buildinfo!), the runtime main builds, its shutdown bounded by the shutdown
# budget (run_until_exit), the lazy SIGINT and SIGTERM watch, and the `process_*` collector
# (`process-metrics`, rust-common).
service-kit = { workspace = true, features = ["runtime", "process-metrics", "http"] }
# The HTTP/1 server on hyper (`http`, rust-common): the header-read and write-stall timeouts and
# the tracked drain; the routes are axum's.
axum = { version = "0.8.9", default-features = false }
# The listener's IPV6_V6ONLY (the wildcard bind is dual-stack whatever the sysctl says), and its
# socket options in the server tests.
socket2 = "0.6.5"
# Civil time and timestamps only: no tzdb or system feature is on.
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# The flags (Q3, Q4). No color: help and errors are plain text, as Go's were.
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# The timer (TokioClock), the metrics listener, the reconciler's channels and select! for its
# cancellable awaits. The multi-threaded runtime (its worker count from available_parallelism,
# Q12) and the signal driver come with service-kit's `runtime` feature.
tokio = { version = "1.54.1", default-features = false, features = [
    "time",
    "net",
    "rt",
    "sync",
    "io-util",
    "macros",
] }
# CancellationToken, Go's context cancellation for the long-lived tasks.
tokio-util = { version = "0.7.20", default-features = false }
# The metrics and health endpoints' status and header types (their server is service-kit's). The
# healthcheck (S3): hyper-util's legacy client, which reads no proxy variable and follows no
# redirect.
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = [
    "tokio",
    "http1",
    "client-legacy",
] }
http-body-util = "0.1.5"
bytes = "1.12.1"

[dev-dependencies]
# The fake engine on a unix socket, for the Docker tests.
docker-client = { workspace = true, features = ["tcp", "tls", "test-util"] }
# The paused clock (start_paused) needs the test runtime.
tokio = { version = "1.54.1", default-features = false, features = [
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
    "test-util",
    "net",
    "io-util",
    "sync",
] }
# The gzip exposition's decoding (tests/exposition.rs); the pure-Rust backend, so no C zlib.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# The Engine API fixtures of the conversion tests, decoded into bollard's models.
serde_json = "1.0.154"
# The bound of the conversion tests' decoding helper.
serde = { version = "1.0.229", default-features = false }
# The captured logs of the tests: a scoped subscriber and a writer that keeps what was logged.
tracing-setup = { workspace = true, features = ["testing"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
# unwind, not abort (awtrix-controller aborts): the reconciler recovers a panicking step with
# catch_unwind, logs it and requests a resync, the way the Go code recovers it with recover().
# Under panic = "abort" there would be nothing to catch.
panic = "unwind"

# Line tables only for the workspace and no debug info for the dependencies: backtraces keep
# their files and lines, and the debug and test binaries shrink to a fraction of their size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The meta-tests scan the tree with regexes; unoptimised, regex compilation and matching dominate
# their run time. Only the regex crates are optimised in dev and test builds.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3
