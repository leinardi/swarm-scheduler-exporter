name: "Set up ShellCheck"
description: >-
  Installs the ShellCheck release binary that droast's required ShellCheck bridge runs from PATH,
  verified against its published digest, instead of the runner image's own version.

runs:
  using: "composite"
  steps:
    # Keep the version in step with the shellcheck-py rev in .pre-commit-config.yaml; the digest is
    # the release asset's, from gh api repos/koalaman/shellcheck/releases/tags/<version>.
    - name: Install ShellCheck
      shell: bash
      env:
        SHELLCHECK_VERSION: v0.11.0
        SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/shellcheck.tar.xz"
        curl -fsSL -o "${archive}" \
          "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
        echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict -
        tar -xJf "${archive}" -C "${RUNNER_TEMP}"
        sudo install -m 0755 "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
        shellcheck --version
