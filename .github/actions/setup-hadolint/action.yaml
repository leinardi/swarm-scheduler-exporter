name: "Set up hadolint"
description: >-
  Installs the hadolint release binary that the hadolint pre-commit hook (language: system) runs,
  verified against its published digest.

runs:
  using: "composite"
  steps:
    # Keep the version in step with the hadolint rev in .pre-commit-config.yaml; the digest is the
    # release asset's, from gh api repos/hadolint/hadolint/releases/tags/<version>.
    - name: Install hadolint
      shell: bash
      env:
        HADOLINT_VERSION: v2.15.1
        HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      run: |
        set -euo pipefail
        binary="${RUNNER_TEMP}/hadolint"
        curl -fsSL -o "${binary}" \
          "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
        echo "${HADOLINT_SHA256}  ${binary}" | sha256sum --check --strict -
        sudo install -m 0755 "${binary}" /usr/local/bin/hadolint
        hadolint --version
