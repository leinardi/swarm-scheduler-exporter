version: 2

registries:
  dhi:
    type: docker-registry
    url: https://dhi.io
    username: leinardi
    password: ${{ secrets.DHI_TOKEN }}
    replaces-base: false

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/deployments/docker"
    registries: ["dhi"]
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    ignore:
      # The build stage's Rust is one line with rust-toolchain.toml, and its
      # patch release is the one the RUST_VERSION argument and the musl
      # standard libraries' sha256s are written for: a tag bump alone would
      # break the build. Bump the image, RUST_VERSION and the checksums
      # together, by hand.
      - dependency-name: "rust"
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    # fix, not chore: the release version is derived from commit types, so a
    # crate bump (security fixes included) produces a patch release. The other
    # ecosystems stay chore(deps) and bump nothing. That includes the docker
    # one, whose base-image bumps do change the shipped image: when one carries
    # a security fix that should ship, release with an explicit version.
    # Dev-dependencies (test clients) never reach the binary, so their bumps
    # are chore(deps) and in a group of their own: one grouped PR carries a
    # single prefix, so mixing them would release a binary that did not change.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      cargo-crates:
        dependency-type: "production"
        patterns:
          - "*"
      cargo-dev-crates:
        dependency-type: "development"
        patterns:
          - "*"
