name: Integration tests

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the exporter's release binary against a throwaway multi-node Swarm of privileged
  # docker:dind containers on the runner's Docker daemon (the testenv crate and its integration
  # suite; see CONTRIBUTING.md). The make target builds the release binary first and fails if RUN
  # selects no test. The job keeps its name: it is the required check.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' }}

      - name: Run the integration suite
        run: make test-integration
