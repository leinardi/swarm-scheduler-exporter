name: Integration tests

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the built exporter against a throwaway multi-node Swarm of privileged docker:dind containers
  # on the runner's Docker daemon (see internal/testenv and CONTRIBUTING.md).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet the integration-tagged packages
        run: make go-vet-integration

      # go-test-integration builds the binary first (it depends on go-build).
      - name: Run integration tests
        run: make go-test-integration
