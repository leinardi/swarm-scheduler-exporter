# The documentation site on GitHub Pages, from the repo-docs-toolkit zensical-site skill
# (references/deploy.md): built with --strict on every pull request, deployed from master. The Pages
# source (GitHub Actions) is set in leinardi/gh-leinardi-iac, not by hand.
#
# Every action is pinned to a full commit SHA (the tag is in the comment); Dependabot's
# github-actions ecosystem updates them. Zensical runs through uv from the committed lock of the
# docs project, tools/docs/uv.lock; Dependabot's uv ecosystem proposes its upgrades.
name: Docs

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCS_UV_PROJECT: tools/docs

# A pull request's runs share one group per branch, so a newer push cancels the older build. Every
# other run shares pages-<ref>, and a deployment is never cancelled half-way: a newer push to master
# waits for the running one (GitHub keeps only the newest pending run, which is the one to deploy).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0} @ {1}', github.workflow, github.head_ref) || format('pages-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv itself is the latest release (the action's default); every package comes from uv.lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # --locked refuses a lock that no longer matches pyproject.toml; uv installs from the lock,
      # hashes included. --strict fails the build on a broken link, a missing anchor or a missing
      # snippet file.
      - name: Build the site
        run: uv run --project "$DOCS_UV_PROJECT" --locked zensical build --strict --clean

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
