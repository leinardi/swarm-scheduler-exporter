name: Scheduled scan

# A release is scanned once, when it is built. Vulnerabilities are published
# every day, so the image people pull and the dependencies on master are scanned
# again every week, with the release's own scanner and settings. A failure
# fails the run, which is what makes it visible: fix it with a new release.
on:
  schedule:
    # Mondays, 06:17 UTC: off the hour, when scheduled runs pile up.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/leinardi/swarm-scheduler-exporter
  PLATFORMS: linux/amd64,linux/arm64
  # Same pin as release.yaml, bumped by hand together with it.
  TRIVY_VERSION: v0.74.0

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # For .trivyignore, the same exceptions the release scan accepts.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      # :latest is resolved once, to its index digest, and both platform images
      # are scanned by their own digests: a :latest that moves during the run
      # cannot mix two releases into one result.
      - name: Scan both platform images of the latest release
        run: |
          set -euo pipefail
          INDEX=$(docker buildx imagetools inspect "$IMAGE_REPO:latest" --format '{{json .Manifest}}')
          echo "$IMAGE_REPO:latest is $(jq -r '.digest' <<<"$INDEX")"
          for platform in ${PLATFORMS//,/ }; do
            PLATFORM_DIGEST=$(jq -r --arg os "${platform%%/*}" --arg arch "${platform#*/}" \
              '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else empty end' \
              <<<"$INDEX")
            if [ -z "$PLATFORM_DIGEST" ]; then
              echo "$IMAGE_REPO:latest has no single $platform image." >&2
              exit 1
            fi
            echo "Scanning $platform: $PLATFORM_DIGEST"
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --platform "$platform" "$IMAGE_REPO@$PLATFORM_DIGEST"
          done

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # govulncheck over master's dependencies, as the release's audit job runs it.
      - name: Audit Go dependencies
        run: make audit-deps
