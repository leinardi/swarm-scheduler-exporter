name: Scheduled scan

# A release is scanned once, when it is built. Vulnerabilities are published every day, so the image
# people pull and the dependencies on master are scanned again every week, with the release's own
# gates: trivy-gate (the latest Trivy, fixable HIGH and CRITICAL findings, .trivyignore.yaml) and
# cargo-deny. A failure fails the run, which is what makes it visible: fix it with a new release.
on:
  schedule:
    # Mondays, 06:17 UTC: off the hour, when scheduled runs pile up.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/leinardi/swarm-scheduler-exporter
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # For .trivyignore.yaml, the same exceptions the release scan accepts.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # :latest is resolved once, to its index digest, and both platform images are scanned by
      # their own digests: a :latest that moves during the run cannot mix two releases into one
      # result.
      - name: Resolve the latest release
        id: latest
        run: |
          set -euo pipefail
          INDEX=$(docker buildx imagetools inspect "$IMAGE_REPO:latest" --format '{{json .Manifest}}')
          echo "$IMAGE_REPO:latest is $(jq -r '.digest' <<<"$INDEX")"
          for platform in ${PLATFORMS//,/ }; do
            PLATFORM_DIGEST=$(jq -r --arg os "${platform%%/*}" --arg arch "${platform#*/}" \
              '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else empty end' \
              <<<"$INDEX")
            if [ -z "$PLATFORM_DIGEST" ]; then
              echo "$IMAGE_REPO:latest has no single $platform image." >&2
              exit 1
            fi
            echo "Scanning $platform: $PLATFORM_DIGEST"
            echo "${platform#*/}=$PLATFORM_DIGEST" >> "$GITHUB_OUTPUT"
          done

      # The release's gate: every fixable HIGH or CRITICAL finding fails, the base's included,
      # since the fix for an inherited one is a release on the base's newer digest. Trivy is its
      # latest release, never pinned, so every scan runs the newest checks.
      - name: Scan the linux/amd64 image of the latest release
        uses: leinardi/gh-composite-actions/trivy-gate@2115c9766c690e2e98afdeb64425c761aa86b072 # v1.4.0
        with:
          image: ${{ env.IMAGE_REPO }}@${{ steps.latest.outputs.amd64 }}
          platform: linux/amd64

      - name: Scan the linux/arm64 image of the latest release
        if: success() || failure()
        uses: leinardi/gh-composite-actions/trivy-gate@2115c9766c690e2e98afdeb64425c761aa86b072 # v1.4.0
        with:
          image: ${{ env.IMAGE_REPO }}@${{ steps.latest.outputs.arm64 }}
          platform: linux/arm64

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny reads the graph through cargo metadata, with the pinned toolchain.
      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Set up cargo-deny
        uses: leinardi/gh-composite-actions/setup-cargo-deny@2115c9766c690e2e98afdeb64425c761aa86b072 # v1.4.0

      # cargo-deny over master's dependencies, as the release's audit job runs it: a new advisory
      # against a crate nobody touched shows up here. rust.mk passes --workspace.
      - name: Check the Rust dependencies with cargo-deny
        run: make rust-deny
