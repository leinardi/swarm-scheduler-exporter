name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

jobs:
  actionlint:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run actionlint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/actionlint@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  pre-commit-hooks:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run pre-commit hooks + reviewdog diff
        uses: leinardi/gha-pre-commit-reviewdog-actions/pre-commit-hooks@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hooks: |
            check-merge-conflict
            end-of-file-fixer
            trailing-whitespace
            check-yaml
            check-json
            check-toml
            check-added-large-files
            dclint
            hadolint
            golangci-lint-config-verify
            golangci-lint-fmt
            golangci-lint-full

  markdownlint:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run markdownlint-cli2 via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/markdownlint-cli2@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run shellcheck via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/shellcheck@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  yamllint:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review (-reporter=github-pr-review in every
    # action this workflow uses, at the pinned commit), which needs pull-requests: write. It
    # creates no check runs, so checks: write is not needed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run yamllint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/yamllint@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    # The release version is derived from the commit types since the last tag,
    # so a commit nobody can classify is a release nobody can version. The local
    # commit-msg hook only runs where `make pre-commit-install` was run; this job
    # is the check that no commit skips. It runs the repository's own
    # conventional-pre-commit hook, so --force-scope applies here too, and it
    # skips merge commits. No pull-request title check: squash merging is
    # disabled, so a title never becomes a commit on master. Enabling squash
    # merging would need one added here first.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the commit messages
        uses: leinardi/gha-pre-commit-reviewdog-actions/conventional-commits@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}

  # The release workflow's scripts, tested with a stub gh: no network, no token.
  release-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test binary-attestation-status.sh
        run: bash .github/scripts/binary-attestation-status.test.sh

  # Modelled on runhold's go-test.yaml, without its reusable-workflow and cache-warmup split:
  # setup-go's built-in cache (keyed on go.sum) is enough at this size.
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run unit tests with the race detector
        run: go test -race ./...

  # The source-aware govulncheck scan (make audit-deps-go). It needs Go and the network, so it
  # does not fit the reviewdog pre-commit-hooks job above, which runs an explicit hook allowlist.
  # The .mk snippets are committed, so the make bootstrap only reads them here.
  go-vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Scan dependencies for known vulnerabilities
        run: make audit-deps-go
