name: Release swarm-scheduler-exporter

# One dispatch resolves the version, checks that CI passed on the commit, audits the dependencies,
# decides the release mode per binary and platform, builds the static binaries once and the image
# from exactly those binaries (the Dockerfile's prebuilt target), smoke-tests and scans that image,
# tags, publishes the image and the GitHub release with the binaries, and moves the `latest`
# pointers.
#
# The order of the release job is deliberate: everything that can fail does so before the tag
# exists, because tags in this repository are immutable ("Immutable tags" ruleset: no update, no
# deletion, no bypass) and cannot be cleaned up after a failure. The image is built once, into a
# job-local registry, and smoke-tested and scanned there; only that digest is copied to GHCR, after
# the tag. Everything after the tag push reuses what is already published only once it is proven to
# be this run's, and never replaces it, so a re-run with the same explicit version finishes a failed
# publish. docs/release.md is the prose version of this, with the recovery procedure and why the
# full image tests run in CI only.
on:
  workflow_dispatch:
    inputs:
      # Left empty, the version comes from the Conventional Commits since the last tag. An explicit
      # one is checked for shape and for being higher than every released version, and is how a
      # recovery re-run names the version it failed on.
      version:
        description: "Version, e.g. 1.2.0 or v1.2.0 (empty: derive from the commits)"
        required: false
      # Resolves the version, checks CI, builds the binaries and the image, smoke-tests and scans
      # it, and stops there: no tag is pushed and nothing is published.
      dry_run:
        description: "Dry run: build, test and scan, stop before the tag is pushed"
        type: boolean
        default: false
  # A push that merges a Dependabot pull request, and leaves only Dependabot's work unreleased with
  # at least one fix(deps) (a new runtime base image or crate), releases the next patch on its own
  # (the dependabot job). Every other push stops at that job: the release stays a human's dispatch.
  push:
    branches:
      - master

# One release at a time, and never cancelled. Two dispatches in flight together would each check
# "higher than every released version" against the same latest tag, both pass, and then publish in
# whatever order they happened to finish - a lower version landing last would take `latest` with it.
# A second dispatch waits for the first instead of racing it, and a run that has started is never
# killed part-way through publishing. A push that merges a Dependabot pull request is the one push
# that may release (the dependabot job below), so it takes the same group: a Dependabot release and
# a dispatch never publish at once, and a lower version can never move `latest` after a higher one.
# Every other push only runs the skipped dependabot job, in a group of its own, so it never queues
# behind a release or replaces a waiting dispatch. GitHub keeps one pending run per group: a
# Dependabot merge arriving while a release runs and a dispatch waits replaces that dispatch
# (cancelled, dispatch it again), which is rare.
concurrency:
  group: >-
    ${{
      (github.event_name == 'workflow_dispatch'
        || (startsWith(github.event.head_commit.message, 'Merge pull request #')
          && contains(github.event.head_commit.message, '/dependabot/')))
      && 'release' || github.run_id
    }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The one definition of a release tag: vMAJOR.MINOR.PATCH, strict SemVer core with no leading
  # zeros, no pre-release and no build metadata, the same regex release-version and release-mode
  # use. The late checks below filter the full tag list through it with grep -E, never through a
  # glob.
  RELEASE_TAG_REGEX: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  APP_NAME: swarm-scheduler-exporter
  IMAGE_REPO: ghcr.io/leinardi/swarm-scheduler-exporter
  # The workflow every published artifact must come from. The guard job makes every run of this
  # file a run on refs/heads/master, so the keyless cosign identity a sign in this run produces is
  # exactly the one release-mode checks a reused image for, and a signature or an attestation from
  # any other workflow or branch does not count.
  SIGNER_WORKFLOW: leinardi/swarm-scheduler-exporter/.github/workflows/release.yaml
  PLATFORMS: linux/amd64,linux/arm64
  # The job-local registries the image is built into, and a dry run copies to. Pinned by index
  # digest, like every image this workflow runs.
  REGISTRY_IMAGE: registry:3.1.2@sha256:c87f33837722a100572e95d7dc4bf539fc42cf68202b13c3bc03c0ff54c3a649
  LOCAL_IMAGE: localhost:5000/swarm-scheduler-exporter
  COPY_IMAGE: localhost:5001/swarm-scheduler-exporter
  # Copies the scanned index to GHCR with its digest. skopeo v1.24.1 is released on GitHub but has
  # no image on quay.io, so this is v1.22.3.
  SKOPEO_IMAGE: quay.io/skopeo/stable:v1.22.3-immutable@sha256:c0ee1f4edca5c01cb8d5611124f92f3cc47196ecab68aee5d0f90834e00574d5

jobs:
  # workflow_dispatch lets the caller pick any branch, and the release job holds contents: write,
  # packages: write and an OIDC identity. Dispatched from a side branch it would tag that branch's
  # tree and publish it as a release and as the image. This fails rather than skips, so such a run
  # is red and not a green no-op, and every other job but audit waits on it.
  #
  # The ruleset cannot express this: tag protection stops a tag moving, not a tag being created
  # from the wrong commit. The second line of defence is the `release` environment, whose
  # deployment branch rule is configured by hand - docs/release.md.
  #
  # Then the version: explicit, or derived by svu from the commits, and in both cases higher than
  # every release, unless it is the recovery of this exact tag on this commit (release-version).
  #
  # On a push, the dependabot job decides: it releases only when everything since the last release
  # is Dependabot's, changes only action pins and the docker cargo updates' files, holds a
  # fix(deps), and CI passed on the push (gh-reusable-workflows' dependabot-release.md). Its version
  # is explicit here.
  dependabot:
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: leinardi/gh-reusable-workflows/.github/workflows/dependabot-release.yaml@de01bef0599aae3ab1d10e74c51b0031788b6d11 # v1.7.0
    with:
      ecosystems: docker cargo

  guard:
    needs: dependabot
    # A dispatch skips the dependabot job; always() keeps this job from being skipped with it.
    if: >-
      always()
      && (github.event_name == 'workflow_dispatch' || needs.dependabot.outputs.release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      previous: ${{ steps.version.outputs.previous }}
      explicit: ${{ steps.version.outputs.explicit }}
      recovery: ${{ steps.version.outputs.recovery }}
      major: ${{ steps.stamp.outputs.major }}
      short_sha: ${{ steps.stamp.outputs.short_sha }}
      build_date: ${{ steps.stamp.outputs.build_date }}
      source_date_epoch: ${{ steps.stamp.outputs.source_date_epoch }}

    steps:
      - name: Refuse to release anything but master
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/master" ]; then
            echo "A release runs from master only (got $REF). Nothing was tagged or published." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-version reads every tag and the commits since the last one.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Only to derive a version: a version typed by hand releases even while GitHub's release
      # downloads fail.
      - name: Install svu
        if: github.event_name == 'workflow_dispatch' && inputs.version == ''
        uses: leinardi/gh-composite-actions/setup-svu@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2

      - name: Resolve the version to release
        id: version
        uses: leinardi/gh-composite-actions/release-version@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.dependabot.outputs.version }}

      # Everything stamped into an artifact comes from the commit, never from the clock or the
      # clone, so a recovery re-run rebuilds the same bytes: a fixed seven-character commit prefix
      # (`git rev-parse --short` grows with the repository), the commit date and time. The image's
      # moving major tag is the bare number (:2), as it has always been; release-version's `major`
      # output is the git form (v2).
      - name: Read the stamps
        id: stamp
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "major=${VERSION%%.*}"
            echo "short_sha=$(git rev-parse HEAD | cut -c1-7)"
            echo "build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"

  # The release-time clippy, test and integration suites are replaced by this gate: CI (ci.yaml)
  # and the integration suite (integration.yaml) must have passed on this exact commit, on its push
  # to master. Its ci-result needs the rust job (fmt, clippy, the
  # tests, the docs, cargo-deny) and the image job, which on a push to master always builds the
  # release binaries with this workflow's make target and the image's prebuilt target from them,
  # and runs the full image suite on amd64 and the reduced one on arm64 (docs/release.md, "What CI
  # proves").
  ci-green:
    needs: guard
    # On a dispatch the dependabot job is skipped, and a skipped job anywhere up the chain skips
    # this one under the implicit success(), even though guard passed. So the condition is explicit:
    # guard passed, and the run is not cancelled.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read

    steps:
      - name: Require CI green on this commit
        uses: leinardi/gh-composite-actions/require-ci-green@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          accepted-events: push

      # The integration suite (integration.yaml) runs the release binary against a real multi-node
      # Swarm, which ci.yaml cannot: it must have passed on the same push to master too.
      - name: Require the integration suite green on this commit
        uses: leinardi/gh-composite-actions/require-ci-green@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          workflow: .github/workflows/integration.yaml
          job: integration
          accepted-events: push

  # The time-sensitive check: advisories are published every day, so the dependency graph CI passed
  # is checked again now (advisories, licences, bans and sources). It needs nothing and starts with
  # guard, so it runs alongside guard, ci-green and the release job's build rather than before them;
  # the release job waits for it to pass before its first step that publishes anything. Pinning
  # cargo-deny does not pin what it knows: the advisory database is fetched at run time.
  audit:
    needs: dependabot
    # A dispatch skips the dependabot job; always() keeps this job from being skipped with it.
    if: >-
      always()
      && (github.event_name == 'workflow_dispatch' || needs.dependabot.outputs.release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny reads the graph through cargo metadata, with the pinned toolchain.
      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Set up cargo-deny
        uses: leinardi/gh-composite-actions/setup-cargo-deny@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2

      - name: Check the Rust dependencies with cargo-deny
        run: make rust-deny

  release:
    needs:
      - guard
      - ci-green
    # Explicit for the same reason as ci-green's.
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.ci-green.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # What dtolnay/rust-toolchain exported to every later step of the job.
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    # Created on first run with no protection rules, which changes nothing by itself. Add a
    # deployment branch rule limiting it to `master`, and required reviewers if a release should need
    # a second pair of eyes - docs/release.md.
    environment: release
    permissions:
      contents: write # push the tag, create the release, upload assets
      packages: write # push the image to GHCR
      id-token: write # cosign keyless signing and provenance via GitHub OIDC
      attestations: write # provenance attestation upload
      actions: read # require-job-success reads the audit job of this run

    steps:
      # No persisted credentials: the one step that writes to the repository, the tag push, passes
      # the token to that one git command.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-mode and toolchain-recover read the tag and its annotation from the clone.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Every external image pinned and every download verified (the same check CI runs): the
      # dhi.io bases by an explicit tag, deliberately not by digest (dhi.io rebuilds them too often
      # to follow by digest), anything else by digest.
      - name: Check the Dockerfile pins
        uses: leinardi/gh-composite-actions/check-pinned-bases@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          dockerfiles: deployments/docker/Dockerfile
          tag-only-images: dhi.io

      # The base both shipped targets run on, by tag, and the BuildKit frontend's digest pin. The
      # build stage's dhi.io/rust is not read: the prebuilt target never uses it.
      - name: Read the base and the frontend pin
        id: base
        run: |
          set -euo pipefail
          BASES=$(sed -nE 's/^FROM[[:space:]]+([^[:space:]-][^[:space:]]*)[[:space:]]+AS[[:space:]]+base[[:space:]]*$/\1/Ip' deployments/docker/Dockerfile)
          if [ "$(grep -c . <<<"$BASES")" -ne 1 ]; then
            echo "The Dockerfile must have exactly one 'FROM <image>:<tag> AS base' line (found: ${BASES:-none})." >&2
            exit 1
          fi
          FRONTEND=$(sed -nE '1s/^#[[:space:]]*syntax=[^[:space:]]+@(sha256:[0-9a-f]{64}).*/\1/p' deployments/docker/Dockerfile)
          if [ -z "$FRONTEND" ]; then
            echo "The Dockerfile's first line must pin the frontend: '# syntax=<image>@sha256:<digest>'." >&2
            exit 1
          fi
          echo "Base: $BASES"
          {
            echo "image=$BASES"
            echo "frontend=$FRONTEND"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The pinned toolchain, not a floating "stable": rust-toolchain.toml names the release, the
      # components and the musl targets.
      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      # A recovery rebuilds with the toolchain the tag records, and fails closed when it cannot
      # switch to it, so a rebuilt binary is byte-identical to one the first attempt published. A
      # fresh release has no tag yet, and this is a no-op.
      - name: Recover the recorded toolchain
        uses: leinardi/gh-composite-actions/toolchain-recover@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          toolchains: rust
          rust-targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          tag: ${{ needs.guard.outputs.recovery == 'true' && needs.guard.outputs.tag || '' }}

      # The toolchain this run builds with, as the tag annotation records it. release-mode checks
      # that an existing tag records exactly this.
      - name: Record the toolchain
        id: toolchains
        uses: leinardi/gh-composite-actions/toolchain-record@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          toolchains: rust

      # The mode is decided here, before anything is built or pushed, per binary and platform, from
      # the Git tag, the image :<tag> on GHCR, the GitHub release and its assets. Only "not found"
      # counts as absent: any other lookup error stops the run. Every published artifact must be
      # attested by this workflow for this commit, and a published image signed by it too. It also
      # installs cosign v3, which signs below.
      #
      #   Git tag         published                                     mode
      #   absent          nothing                                       fresh
      #   absent          an image, or a release                        stop
      #   on another commit                                             stop
      #   on this commit  the image, attested and signed                reuse (the assets from it)
      #   on this commit  no image, or not every asset                  publish
      #   on this commit  anything unattested, unsigned or differing    stop: needs a human
      #
      # Per platform: image and asset published, they must be the same bytes; image only, the asset
      # is extracted from it; asset only, the image is built with it; neither, the binary is
      # rebuilt. docs/release.md describes each mode.
      - name: Decide the release mode
        id: mode
        uses: leinardi/gh-composite-actions/release-mode@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          tag: ${{ needs.guard.outputs.tag }}
          image: ${{ env.IMAGE_REPO }}
          binaries: ${{ env.APP_NAME }}
          platforms: ${{ env.PLATFORMS }}
          signer-workflow: ${{ env.SIGNER_WORKFLOW }}
          expected-toolchains: ${{ steps.toolchains.outputs.lines }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      # The published digest a reuse continues with, from the plan.
      - name: Read the reused digest
        id: reused
        if: steps.mode.outputs.mode == 'reuse'
        env:
          PLAN: ${{ steps.mode.outputs.plan-file }}
        run: |
          set -euo pipefail
          DIGEST=$(jq -r '.images[0].digest // empty' "$PLAN")
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The plan names no published digest to reuse (got '$DIGEST')." >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The annotated tag, in the clone only, until the point of no return below, recording the
      # toolchain. On a recovery it is already here: release-mode checked it is on this commit and
      # records this toolchain.
      - name: Create the tag locally
        if: steps.mode.outputs.tag-exists != 'true'
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          TOOLCHAINS: ${{ steps.toolchains.outputs.lines }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s %s\n\n%s\n' "$APP_NAME" "$TAG" "$TOOLCHAINS" > "$RUNNER_TEMP/tag-message.txt"
          git tag -a "$TAG" -F "$RUNNER_TEMP/tag-message.txt"

      # The release's own cache, under its own prefix: written only by this workflow, which runs on
      # master only, and never CI's. It speeds the build, and changes nothing in what it produces.
      - name: Cache the Rust build
        if: steps.mode.outputs.rebuild != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: release

      # The versions the Makefile pins and the Dockerfile's build stage copies
      # (meta/tests/toolchain.rs), as CI.
      - name: Set up cargo-zigbuild
        if: steps.mode.outputs.rebuild != ''
        uses: leinardi/gh-composite-actions/setup-zigbuild@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          zig-version: 0.17.0
          cargo-zigbuild-version: 0.24.0

      # The platforms nothing is published for, built with CI's make target (rust-release-binaries):
      # static musl binaries, cross-compiled by cargo-zigbuild, the build paths remapped, the stamps
      # from the commit. Then the published binaries release-mode verified and fetched are laid over
      # them, so the published bytes win, and checksums.txt is written over the final set.
      - name: Build and assemble the release binaries
        env:
          REBUILD: ${{ steps.mode.outputs.rebuild }}
          PLAN: ${{ steps.mode.outputs.plan-file }}
          CHECKSUMS: ${{ steps.mode.outputs.checksums }}
          TAG: ${{ needs.guard.outputs.tag }}
          SHORT_SHA: ${{ needs.guard.outputs.short_sha }}
          BUILD_DATE: ${{ needs.guard.outputs.build_date }}
        run: |
          set -euo pipefail
          PLATFORMS_TO_BUILD=()
          for entry in $REBUILD; do
            if [[ "$entry" != "$APP_NAME@"* ]]; then
              echo "release-mode asks to rebuild '$entry', which is not $APP_NAME." >&2
              exit 1
            fi
            PLATFORMS_TO_BUILD+=("${entry#"$APP_NAME@"}")
          done
          mkdir -p dist
          if [ "${#PLATFORMS_TO_BUILD[@]}" -gt 0 ]; then
            make rust-release-binaries RUST_RELEASE_PLATFORMS="${PLATFORMS_TO_BUILD[*]}" \
              GIT_VERSION="$TAG" GIT_COMMIT="$SHORT_SHA" BUILD_DATE="$BUILD_DATE"
          fi
          # Read into a variable first: a failure inside a process substitution would be
          # swallowed, and an empty list would read as "nothing published".
          FETCHED=$(jq -r '.binaries[] | select(.source != "rebuild") | "\(.asset) \(.file)"' "$PLAN")
          while read -r asset file; do
            [ -n "$asset" ] || continue
            cp "$file" "dist/$asset"
            echo "$asset: the published binary ($(sha256sum < "dist/$asset" | cut -d' ' -f1))"
          done <<<"$FETCHED"
          for platform in ${PLATFORMS//,/ }; do
            asset="$APP_NAME-${platform//\//-}"
            if [ ! -f "dist/$asset" ]; then
              echo "dist/$asset was neither rebuilt nor fetched." >&2
              exit 1
            fi
          done
          make rust-release-checksums
          if [ "$CHECKSUMS" = "verify" ]; then
            PUBLISHED="$(dirname "$PLAN")/published-checksums.txt"
            if ! cmp -s "$PUBLISHED" dist/checksums.txt; then
              echo "The published checksums.txt differs from the one over the final binaries. Nothing was published; it needs a human." >&2
              # diff exits 1 on the difference it prints, which ends the step under set -e.
              diff "$PUBLISHED" dist/checksums.txt >&2
              exit 1
            fi
          fi
          cat dist/checksums.txt

      # The run attempt is part of the name: "Re-run failed jobs" re-runs this job inside the same
      # workflow run, and upload-artifact refuses to overwrite an artifact the first attempt already
      # uploaded, which would fail the re-run before its recovery publishing starts.
      - name: Upload build artifacts (for debugging)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ needs.guard.outputs.tag }}-${{ github.run_attempt }}
          path: |
            dist/${{ env.APP_NAME }}-linux-amd64
            dist/${{ env.APP_NAME }}-linux-arm64
            dist/checksums.txt

      # Host network, so the builder reaches the job-local registry on localhost.
      - name: Set up Buildx
        if: steps.mode.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      # The base, dhi.io/static, needs a login; the prebuilt target pulls nothing else from dhi.io.
      - name: Log in to Docker Hardened Images (dhi.io)
        if: steps.mode.outputs.build == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: leinardi
          password: ${{ secrets.DHI_TOKEN }}

      # The image is built once, into a registry that lives and dies with this job, and only the
      # digest that was tested and scanned is copied to GHCR. A dry run starts a second one to
      # exercise that copy.
      - name: Start the job-local registries
        if: steps.mode.outputs.build == 'true'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          docker run -d --name local-registry -p 5000:5000 "$REGISTRY_IMAGE"
          PORTS=(5000)
          if [ "$DRY_RUN" = "true" ]; then
            docker run -d --name copy-registry -p 5001:5000 "$REGISTRY_IMAGE"
            PORTS+=(5001)
          fi
          for port in "${PORTS[@]}"; do
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://localhost:$port/v2/"; then
                continue 2
              fi
              sleep 1
            done
            echo "The job-local registry on port $port did not come up." >&2
            exit 1
          done

      # The only image build: the Dockerfile's prebuilt target, as CI builds it, from the dist/
      # binaries above (the `dist` build context), so each platform's image binary is that
      # platform's release asset byte for byte. Pushed by digest with no tag, with the SBOM and
      # mode=max provenance in the index. Every layer is recompressed as gzip: the dhi.io base ships
      # zstd layers, and for a zstd image skopeo rewrites the index entries with a compression
      # annotation, which --preserve-digests then refuses, so the copy below could not keep the
      # tested digest. No layer cache: the target is the base plus one COPY.
      - name: Build the image into the job-local registry
        id: build
        if: steps.mode.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployments/docker/Dockerfile
          target: prebuilt
          build-contexts: |
            dist=dist
          # push=true inside `outputs` instead of the `push` input: `push` adds a second, tagged
          # registry exporter.
          outputs: type=image,name=${{ env.LOCAL_IMAGE }},push-by-digest=true,name-canonical=true,push=true,compression=gzip,force-compression=true
          platforms: ${{ env.PLATFORMS }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.guard.outputs.tag }}
            COMMIT=${{ needs.guard.outputs.short_sha }}
            DATE=${{ needs.guard.outputs.build_date }}
            SOURCE_DATE_EPOCH=${{ needs.guard.outputs.source_date_epoch }}

      # The base is pinned by tag, so the digest it resolved to is read from the provenance of the
      # index the build pushed, per platform: the exact base the release ships, which the release
      # notes and the summary record. It may be a newer dhi.io rebuild of the tag than CI built on;
      # the smoke test and the scan below run on this exact image. The frontend, pinned by digest,
      # must be the one the build used. Anything else the build pulled fails the run (BuildKit's
      # SBOM scanner, docker/buildkit-syft-scanner, generates the SBOM and is not part of the
      # image).
      #
      # A reused image was not built here: its provenance is read from GHCR, for the release notes
      # of a release that does not exist yet.
      - name: Read the base digests the build used
        id: resolved
        if: steps.mode.outputs.build == 'true' || steps.mode.outputs.mode == 'reuse'
        env:
          IMAGE: ${{ steps.mode.outputs.build == 'true' && format('{0}@{1}', env.LOCAL_IMAGE, steps.build.outputs.digest) || format('{0}@{1}', env.IMAGE_REPO, steps.reused.outputs.digest) }}
          BASE: ${{ steps.base.outputs.image }}
          FRONTEND: ${{ steps.base.outputs.frontend }}
        run: |
          set -euo pipefail
          PROVENANCE=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Provenance}}')
          BASE_PURL="pkg:docker/${BASE%:*}@${BASE##*:}?"
          LINES=()
          for platform in ${PLATFORMS//,/ }; do
            USED=$(jq -r --arg platform "$platform" '
              .[$platform].SLSA
              | (.materials // .buildDefinition.resolvedDependencies // [])[]
              | select(.uri | startswith("pkg:docker/"))
              | select(.uri | startswith("pkg:docker/docker/buildkit-syft-scanner@") | not)
              | "\(.uri) sha256:\(.digest.sha256)"
            ' <<<"$PROVENANCE" | sort -u)
            BASE_DIGESTS=$(awk -v purl="$BASE_PURL" 'index($1, purl) == 1 {print $2}' <<<"$USED" | sort -u)
            OTHERS=$(awk -v purl="$BASE_PURL" 'index($1, purl) != 1 && index($1, "pkg:docker/docker/dockerfile@") != 1' <<<"$USED")
            FRONTENDS=$(awk 'index($1, "pkg:docker/docker/dockerfile@") == 1 {print $2}' <<<"$USED" | sort -u)
            if [ "$(grep -c . <<<"$BASE_DIGESTS")" -ne 1 ] || [ -n "$OTHERS" ] || [ "$FRONTENDS" != "$FRONTEND" ]; then
              echo "The $platform build did not pull exactly one $BASE and the pinned frontend $FRONTEND." >&2
              echo "Pulled (provenance):" >&2
              echo "${USED:-nothing}" >&2
              exit 1
            fi
            echo "$platform: $BASE@$BASE_DIGESTS"
            LINES+=("$platform \`$BASE@$BASE_DIGESTS\`")
          done
          {
            echo "lines<<EOF"
            printf -- '- %s\n' "${LINES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Each platform image of the index, by its own digest: what is tested and scanned below is
      # exactly what is copied to GHCR.
      - name: Resolve the platform images
        id: platform
        if: steps.mode.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          INDEX=$(docker buildx imagetools inspect "$LOCAL_IMAGE@$DIGEST" --format '{{json .Manifest}}')
          for platform in ${PLATFORMS//,/ }; do
            PLATFORM_DIGEST=$(jq -r --arg os "${platform%%/*}" --arg arch "${platform#*/}" \
              '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else empty end' \
              <<<"$INDEX")
            if [ -z "$PLATFORM_DIGEST" ]; then
              echo "The index $DIGEST has no single $platform image." >&2
              exit 1
            fi
            echo "$platform: $PLATFORM_DIGEST"
            echo "${platform#*/}=$PLATFORM_DIGEST" >> "$GITHUB_OUTPUT"
          done

      # The arm64 image runs on the amd64 runner through binfmt emulation. The registered emulator
      # image is pinned by index digest, because the action's default is the moving `latest` tag.
      - name: Set up QEMU
        if: steps.mode.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      # The short smoke test of each platform image, pulled back from the job-local registry by its
      # digest rather than built again: the image binary is the platform's release asset (sha256),
      # and the container starts, logs this release's stamps in its startup line and serves them as
      # swarm_exporter_build_info on /metrics (arm64 under QEMU). The binary has no --version, and
      # no Docker socket is mounted: the exporter serves while its workers retry. The full and
      # reduced suites ran in CI on the same target (the ci-green job); this proves the image the
      # release built starts.
      - name: Smoke-test both platform images
        if: steps.mode.outputs.build == 'true'
        env:
          AMD64: ${{ steps.platform.outputs.amd64 }}
          ARM64: ${{ steps.platform.outputs.arm64 }}
          EXPECT: ${{ needs.guard.outputs.tag }} ${{ needs.guard.outputs.short_sha }} ${{ needs.guard.outputs.build_date }}
        run: |
          set -euo pipefail
          for platform in ${PLATFORMS//,/ }; do
            arch="${platform#*/}"
            case "$arch" in
              amd64) PLATFORM_DIGEST="$AMD64" ;;
              arm64) PLATFORM_DIGEST="$ARM64" ;;
              *) echo "No platform digest for $platform." >&2; exit 1 ;;
            esac
            docker pull "$LOCAL_IMAGE@$PLATFORM_DIGEST"
            docker tag "$LOCAL_IMAGE@$PLATFORM_DIGEST" "$APP_NAME:release-$arch"
            scripts/image-test.sh --tier smoke --image "$APP_NAME:release-$arch" --platform "$platform" \
              --binary "dist/$APP_NAME-${platform//\//-}" --expect-version "$EXPECT"
            docker image rm "$APP_NAME:release-$arch" "$LOCAL_IMAGE@$PLATFORM_DIGEST" >/dev/null
          done

      # A HIGH or CRITICAL finding with a fix upstream fails the run here, before any tag exists, the
      # base's own included. Unfixed findings do not. The only exceptions are the ones committed in
      # .trivyignore.yaml, each with a statement and an expiry. Trivy is its latest release, never
      # pinned.
      - name: Scan the linux/amd64 image
        if: steps.mode.outputs.build == 'true'
        uses: leinardi/gh-composite-actions/trivy-gate@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          image: ${{ env.LOCAL_IMAGE }}@${{ steps.platform.outputs.amd64 }}
          platform: linux/amd64

      - name: Scan the linux/arm64 image
        if: steps.mode.outputs.build == 'true'
        uses: leinardi/gh-composite-actions/trivy-gate@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          image: ${{ env.LOCAL_IMAGE }}@${{ steps.platform.outputs.arm64 }}
          platform: linux/arm64

      # The last look at the tags before the point of no return. Concurrency serializes the
      # workflow, but a tag can also arrive from outside it, and the version was resolved before
      # several minutes of building. This asks the remote, not the local clone, and it asks now.
      - name: Gate the tag
        if: steps.mode.outputs.mode == 'fresh' || inputs.dry_run
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          EXISTS: ${{ steps.mode.outputs.tag-exists }}
        run: |
          set -euo pipefail

          # Its own assignment, so a failed ls-remote stops the step under
          # set -e instead of reading as "no tags"; only grep finding no release
          # tag is allowed to come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || true; } \
            | sort -V \
            | tail -n1)

          if [ -z "$HIGHEST_REMOTE" ] || [ "$HIGHEST_REMOTE" = "$TAG" ]; then
            exit 0
          fi
          HIGHEST=$(printf '%s\n%s\n' "$TAG" "$HIGHEST_REMOTE" | sort -V | tail -n1)
          if [ "$HIGHEST" = "$TAG" ]; then
            exit 0
          fi

          # A recovery's tag is already on this commit and its artifacts are
          # legitimate; it finishes, and simply does not become latest.
          if [ "$EXISTS" = "true" ]; then
            echo "::notice::$HIGHEST_REMOTE is higher than $TAG. Finishing the recovery of $TAG, which will not become latest."
            exit 0
          fi

          echo "$HIGHEST_REMOTE was published while this run was building, so $TAG would be a lower immutable tag. Nothing was pushed; release a higher version." >&2
          exit 1

      # The image ownership check, right before the tag is pushed: the version must not be held by
      # an image, or the tag would point at a version this run can never publish. Fail-closed: only
      # "not found" reads as absent.
      - name: Check the version image is absent
        if: steps.mode.outputs.mode == 'fresh' || inputs.dry_run
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          if OUT=$(docker buildx imagetools inspect "$IMAGE_REPO:$TAG" 2>&1); then
            echo "$IMAGE_REPO:$TAG appeared while this run was building. Nothing was pushed; release a higher version - docs/release.md." >&2
            exit 1
          elif ! grep -qiE 'not found|manifest unknown' <<<"$OUT"; then
            echo "Could not tell whether $IMAGE_REPO:$TAG exists: $OUT" >&2
            exit 1
          fi

      # The copy step below, against the second job-local registry instead of GHCR, with the same
      # checks: the digest survives, and so do the SBOM and provenance manifests of both platforms.
      - name: Rehearse the copy on a second local registry
        if: inputs.dry_run
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --network host "$SKOPEO_IMAGE" copy --all --preserve-digests \
            --src-tls-verify=false --dest-tls-verify=false \
            "docker://$LOCAL_IMAGE@$DIGEST" "docker://$COPY_IMAGE@$DIGEST"

          RAW=$(mktemp)
          docker run --rm --network host "$SKOPEO_IMAGE" inspect --raw --tls-verify=false \
            "docker://$COPY_IMAGE@$DIGEST" > "$RAW"
          COPIED="sha256:$(sha256sum < "$RAW" | cut -d' ' -f1)"
          if [ "$COPIED" != "$DIGEST" ]; then
            echo "The copied index is $COPIED, not the tested $DIGEST." >&2
            exit 1
          fi

          ATTESTATIONS=$(jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length' "$RAW")
          WANT=$(tr ',' '\n' <<<"$PLATFORMS" | wc -l)
          if [ "$ATTESTATIONS" -ne "$WANT" ]; then
            echo "The copied index carries $ATTESTATIONS attestation manifests, want $WANT (one per platform)." >&2
            exit 1
          fi
          echo "Copied $DIGEST with its digest and $ATTESTATIONS attestation manifests intact."

      # The audit runs alongside this job rather than before it, so the build does not wait for
      # the advisories; nothing is published until it has passed in this run attempt (an earlier
      # attempt's pass never counts, so a recovery uses "Re-run all jobs" - docs/release.md). A dry
      # run waits for it too, so it reports the audit a real run would face.
      - name: Require the audit to have passed
        uses: leinardi/gh-composite-actions/require-job-success@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          job: audit

      - name: Report what a real run would publish
        if: inputs.dry_run
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          PREVIOUS: ${{ needs.guard.outputs.previous }}
          EXPLICIT: ${{ needs.guard.outputs.explicit }}
          MODE: ${{ steps.mode.outputs.mode }}
          REBUILD: ${{ steps.mode.outputs.rebuild }}
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.platform.outputs.amd64 }}
          ARM64: ${{ steps.platform.outputs.arm64 }}
          BASE: ${{ steps.base.outputs.image }}
          BASE_DIGESTS: ${{ steps.resolved.outputs.lines }}
          TOOLCHAINS: ${{ steps.toolchains.outputs.lines }}
        run: |
          set -euo pipefail
          {
            echo "# Dry run: $TAG"
            echo
            echo "Previous tag: ${PREVIOUS:-none}. Explicit version: $EXPLICIT. A real run would take the $MODE mode, rebuilding: ${REBUILD:-nothing}."
            echo
            echo "No tag was created and nothing was published. The binaries were built with $TOOLCHAINS, and the image index"
            echo "$DIGEST was built from them on \`$BASE\` into a job-local registry. Its platform images (amd64 $AMD64,"
            echo "arm64 $ARM64) were smoke-tested and scanned, and the index was copied to a second local registry with its"
            echo "digest and attestation manifests intact."
            echo
            echo "## The base each platform was built on"
            echo
            echo "$BASE_DIGESTS"
            echo
            echo '## Artifacts'
            echo
            echo '```text'
            cat dist/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Per attempt, like the binaries above, so a re-run dry run does not collide with the first
      # attempt's upload.
      - name: Upload the unpublished artifacts for inspection
        if: inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-${{ needs.guard.outputs.tag }}-${{ github.run_attempt }}
          path: dist

      # The point of no return. Everything after it reuses a published artifact only once it is
      # proven to be this run's and never replaces one, so a re-run with the same explicit version
      # finishes a failed publish. The token reaches this one git command as a header, never the
      # clone's config.
      - name: Push the tag
        if: ${{ !inputs.dry_run && steps.mode.outputs.mode == 'fresh' }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin "refs/tags/$TAG"

      # The tested index, byte for byte, with no tag at all: a version tag is only ever added once
      # the digest has been attested and signed, so an untagged digest left by a failed run is
      # inert.
      - name: Copy the image to GHCR by digest
        if: ${{ !inputs.dry_run && steps.mode.outputs.build == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --network host -v "$HOME/.docker/config.json:/auth.json:ro" "$SKOPEO_IMAGE" \
            copy --all --preserve-digests --src-tls-verify=false --dest-authfile /auth.json \
            "docker://$LOCAL_IMAGE@$DIGEST" "docker://$IMAGE_REPO@$DIGEST"

      # What GHCR now serves under the digest is hashed here, not taken from a tool's report, so the
      # digest attested and signed below is the one that was tested and scanned.
      - name: Check GHCR serves the tested index
        if: ${{ !inputs.dry_run && steps.mode.outputs.build == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          RAW=$(mktemp)
          docker run --rm -v "$HOME/.docker/config.json:/auth.json:ro" "$SKOPEO_IMAGE" \
            inspect --raw --authfile /auth.json "docker://$IMAGE_REPO@$DIGEST" > "$RAW"
          SERVED="sha256:$(sha256sum < "$RAW" | cut -d' ' -f1)"
          if [ "$SERVED" != "$DIGEST" ]; then
            echo "GHCR serves $SERVED for $IMAGE_REPO@$DIGEST, not the tested index. Nothing was tagged." >&2
            exit 1
          fi

      - name: Attest image provenance
        if: ${{ !inputs.dry_run && steps.mode.outputs.build == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A new digest is signed with this workflow's keyless identity. A reused one already carries
      # that signature: release-mode verified it, with its attestation, before deciding to reuse it.
      - name: Sign the image with cosign (keyless via GitHub OIDC)
        id: sign
        if: ${{ !inputs.dry_run }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DIGEST: ${{ steps.reused.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "reuse" ]; then
            echo "$IMAGE_REPO@$DIGEST carries this workflow's attestation and signature: reusing it."
          else
            cosign sign --yes "$IMAGE_REPO@$DIGEST"
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The reused image is already immutable and published, so its scan cannot stop anything:
      # findings are reported as warnings, for a human to judge whether the next version should
      # follow sooner.
      - name: Scan the reused linux/amd64 image
        id: reuse-scan-amd64
        if: ${{ !inputs.dry_run && steps.mode.outputs.mode == 'reuse' }}
        continue-on-error: true # findings in an image already published are warnings
        uses: leinardi/gh-composite-actions/trivy-gate@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          image: ${{ env.IMAGE_REPO }}@${{ steps.sign.outputs.digest }}
          platform: linux/amd64

      - name: Scan the reused linux/arm64 image
        id: reuse-scan-arm64
        if: ${{ !inputs.dry_run && steps.mode.outputs.mode == 'reuse' }}
        continue-on-error: true # findings in an image already published are warnings
        uses: leinardi/gh-composite-actions/trivy-gate@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          image: ${{ env.IMAGE_REPO }}@${{ steps.sign.outputs.digest }}
          platform: linux/arm64

      - name: Warn about the reused image's findings
        if: ${{ !inputs.dry_run && steps.mode.outputs.mode == 'reuse' && (steps.reuse-scan-amd64.outcome != 'success' || steps.reuse-scan-arm64.outcome != 'success') }}
        env:
          DIGEST: ${{ steps.sign.outputs.digest }}
          AMD64: ${{ steps.reuse-scan-amd64.outcome }}
          ARM64: ${{ steps.reuse-scan-arm64.outcome }}
        run: |
          echo "::warning::The reused $IMAGE_REPO@$DIGEST has fixable HIGH or CRITICAL findings, or could not be scanned (amd64: $AMD64, arm64: $ARM64). It is already published and was not changed; consider releasing a new version."

      - name: Tag the image with the version
        if: ${{ !inputs.dry_run && steps.mode.outputs.build == 'true' }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          DIGEST: ${{ steps.sign.outputs.digest }}
        run: |
          set -euo pipefail
          # Checked again right before tagging: a version tag that appeared since
          # the checks above is never overwritten.
          if OUT=$(docker buildx imagetools inspect "$IMAGE_REPO:$TAG" 2>&1); then
            echo "$IMAGE_REPO:$TAG appeared while this run was publishing. It was not overwritten: re-run to verify it, or hand it to a human - docs/release.md." >&2
            exit 1
          elif ! grep -qiE 'not found|manifest unknown' <<<"$OUT"; then
            echo "Could not tell whether $IMAGE_REPO:$TAG exists: $OUT" >&2
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE_REPO:$TAG" "$IMAGE_REPO@$DIGEST"

      # The binaries are the same bytes on every run, a recovery included (rebuilt reproducibly, or
      # the published ones release-mode fetched), so a binary an earlier run of this commit attested
      # keeps that attestation: only the ones still missing one are attested, and a partial recovery
      # never duplicates one. The action decides per binary and fails closed: an answer it cannot
      # classify, or an attestation this workflow did not produce, stops the run before anything is
      # drafted. A dry run runs it too, as a rehearsal; only the attestation itself is skipped.
      - name: Check which binaries need an attestation
        id: binattest
        uses: leinardi/gh-composite-actions/binary-attestation-status@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          files: |
            dist/${{ env.APP_NAME }}-linux-amd64
            dist/${{ env.APP_NAME }}-linux-arm64
          signer-workflow: ${{ env.SIGNER_WORKFLOW }}

      - name: Attest the release binaries
        if: ${{ !inputs.dry_run && steps.binattest.outputs.missing != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.binattest.outputs.missing }}

      # Every expected asset is in dist/: rebuilt reproducibly, or the published bytes release-mode
      # verified, so a published one can be checked byte for byte. Present and matching: kept.
      # Present and different: the run fails. Missing: uploaded, never with --clobber. An asset
      # nobody expects fails the run too. The release is created as a draft, with the base and the
      # toolchain above the generated notes, and stays one until the latest checks below.
      - name: Draft the GitHub release and reconcile its assets
        id: assets
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          BASE: ${{ steps.base.outputs.image }}
          BASE_DIGESTS: ${{ steps.resolved.outputs.lines }}
          TOOLCHAINS: ${{ steps.toolchains.outputs.lines }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          EXPECTED=("${APP_NAME}-linux-amd64" "${APP_NAME}-linux-arm64" "checksums.txt")

          if ! OUT=$(gh release view "$TAG" --json isDraft 2>&1); then
            if ! grep -qi 'release not found' <<<"$OUT"; then
              echo "Could not tell whether the release $TAG exists: $OUT" >&2
              exit 1
            fi
            NOTES=$(printf 'The binaries are built with %s, zig and cargo-zigbuild as the repository pins them. The image is built on `%s`, which resolved to:\n\n%s\n' \
              "$TOOLCHAINS" "$BASE" "$BASE_DIGESTS")
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "$TAG" --notes "$NOTES"
          fi

          # Read into a variable first: a failure inside a process substitution
          # would be swallowed, and an empty list would read as "nothing published".
          NAMES=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          PUBLISHED=()
          if [ -n "$NAMES" ]; then
            mapfile -t PUBLISHED <<<"$NAMES"
          fi

          for name in "${PUBLISHED[@]}"; do
            if ! printf '%s\n' "${EXPECTED[@]}" | grep -qxF "$name"; then
              echo "The release $TAG carries an unexpected asset '$name'. Nothing was changed; it needs a human." >&2
              exit 1
            fi
          done

          published() { printf '%s\n' "${PUBLISHED[@]}" | grep -qxF "$1"; }
          local_sum() { sha256sum "$1" | awk '{print $1}'; }

          DOWNLOADS=$(mktemp -d)
          if published checksums.txt; then
            gh release download "$TAG" --pattern checksums.txt --dir "$DOWNLOADS"
          fi

          VERIFIED=()
          UPLOADED=()
          for name in "${EXPECTED[@]}"; do
            if published "$name"; then
              if [ "$name" != "checksums.txt" ]; then
                gh release download "$TAG" --pattern "$name" --dir "$DOWNLOADS"
              fi
              REMOTE_SUM=$(local_sum "$DOWNLOADS/$name")
              LOCAL_SUM=$(local_sum "dist/$name")
              if [ "$REMOTE_SUM" != "$LOCAL_SUM" ]; then
                echo "The published $name ($REMOTE_SUM) differs from this run's ($LOCAL_SUM). Nothing was replaced; it needs a human." >&2
                exit 1
              fi
              if [ "$name" != "checksums.txt" ] && [ -f "$DOWNLOADS/checksums.txt" ]; then
                LISTED=$(awk -v n="$name" '$2 == n {print $1}' "$DOWNLOADS/checksums.txt")
                if [ "$LISTED" != "$REMOTE_SUM" ]; then
                  echo "The published $name ($REMOTE_SUM) does not match the published checksums.txt (${LISTED:-absent}). Nothing was replaced; it needs a human." >&2
                  exit 1
                fi
              fi
              VERIFIED+=("$name")
            else
              gh release upload "$TAG" "dist/$name"
              UPLOADED+=("$name")
            fi
          done

          {
            echo "verified=${VERIFIED[*]}"
            echo "uploaded=${UPLOADED[*]}"
          } >> "$GITHUB_OUTPUT"

      # The moving pointers go last, each after its own fresh look at the remote: a version that is
      # no longer the highest does not take them. Best-effort, not atomic - docs/release.md.
      - name: Move the image major and latest tags
        id: pointers
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          MAJOR: ${{ needs.guard.outputs.major }}
          DIGEST: ${{ steps.sign.outputs.digest }}
        run: |
          set -euo pipefail
          # Its own assignment, so a failed ls-remote stops the step under
          # set -e instead of reading as "no tags"; only grep finding no release
          # tag is allowed to come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || true; } \
            | sort -V \
            | tail -n1)
          if [ "$HIGHEST_REMOTE" != "$TAG" ]; then
            echo "::notice::$HIGHEST_REMOTE is higher than $TAG, so :$MAJOR and :latest were left where they are."
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE_REPO:$MAJOR" -t "$IMAGE_REPO:latest" "$IMAGE_REPO@$DIGEST"
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        id: publish
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Its own assignment, so a failed ls-remote stops the step under
          # set -e instead of reading as "no tags"; only grep finding no release
          # tag is allowed to come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || true; } \
            | sort -V \
            | tail -n1)
          LATEST=false
          if [ "$HIGHEST_REMOTE" = "$TAG" ]; then
            LATEST=true
          fi
          gh release edit "$TAG" --draft=false --latest="$LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      # GHCR tags and GitHub releases cannot be moved together atomically, so a tag created outside
      # this workflow between the two moves above can leave them disagreeing. Nothing is moved
      # back: this run cannot know that the other version's image exists or is trustworthy. It says
      # so instead.
      - name: Check that the pointers agree
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          MAJOR: ${{ needs.guard.outputs.major }}
          MOVED: ${{ steps.pointers.outputs.moved }}
        run: |
          set -euo pipefail
          # Its own assignment, so a failed ls-remote stops the step under
          # set -e instead of reading as "no tags"; only grep finding no release
          # tag is allowed to come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || true; } \
            | sort -V \
            | tail -n1)
          if [ "$MOVED" = "true" ] && [ "$HIGHEST_REMOTE" != "$TAG" ]; then
            echo "::warning::$HIGHEST_REMOTE was tagged while $TAG was publishing. The image :latest and :$MAJOR may point at $TAG while GitHub marks another release Latest. Fix: re-dispatch $HIGHEST_REMOTE, whose own late checks repoint them; if that tag was created outside this workflow and has no image, retag by hand as docs/release.md describes."
          fi

      - name: Summarize the release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          PREVIOUS: ${{ needs.guard.outputs.previous }}
          RECOVERY: ${{ steps.mode.outputs.tag-exists }}
          MODE: ${{ steps.mode.outputs.mode }}
          REBUILD: ${{ steps.mode.outputs.rebuild }}
          DIGEST: ${{ steps.sign.outputs.digest }}
          BASE: ${{ steps.base.outputs.image }}
          BASE_DIGESTS: ${{ steps.resolved.outputs.lines }}
          MOVED: ${{ steps.pointers.outputs.moved }}
          LATEST: ${{ steps.publish.outputs.latest }}
          VERIFIED: ${{ steps.assets.outputs.verified }}
          UPLOADED: ${{ steps.assets.outputs.uploaded }}
        run: |
          set -euo pipefail
          {
            echo "# Released $TAG"
            echo
            echo "Previous tag: ${PREVIOUS:-none}. Recovery: $RECOVERY. Mode: $MODE. Rebuilt: ${REBUILD:-nothing}. Base: \`$BASE\`."
            echo
            echo "- [Release](https://github.com/leinardi/swarm-scheduler-exporter/releases/tag/$TAG) - marked latest: $LATEST"
            echo "- [Image](https://github.com/leinardi/swarm-scheduler-exporter/pkgs/container/swarm-scheduler-exporter): \`$IMAGE_REPO:$TAG\` (\`$DIGEST\`) - :latest moved: $MOVED"
            echo "- Assets uploaded: ${UPLOADED:-none}"
            echo "- Assets verified by sha256: ${VERIFIED:-none}"
            echo
            echo "## The base each platform was built on"
            echo
            echo "$BASE_DIGESTS"
          } >> "$GITHUB_STEP_SUMMARY"
