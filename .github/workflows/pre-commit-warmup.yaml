name: Pre-commit Cache Warm-up

# Keeps a master-branch cache of the pre-commit hook environments for pull requests to restore: the
# pre-commit-all job in ci.yaml reads it under the same key
# (pre-commit|<OS>|<hash of .pre-commit-config.yaml>). The weekly schedule is eviction insurance:
# GitHub evicts a cache nobody has read for seven days. The self-path re-runs the warm-up when this
# file changes, for example when Dependabot bumps the pinned reusable workflow.
on:
  push:
    branches:
      - master
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/pre-commit-warmup.yaml
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

concurrency:
  group: pre-commit-warmup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm-pre-commit-cache:
    # actions: write lets the reusable workflow's prune job delete the older caches of this ref,
    # keeping the newest two.
    permissions:
      contents: read
      actions: write
    uses: leinardi/gh-reusable-workflows/.github/workflows/pre-commit-warmup.yaml@ba5f6ec7596a5eb306ad2f7511a888ec8dde6d53 # v1.4.0
