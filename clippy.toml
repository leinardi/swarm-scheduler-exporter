# Applies to every workspace member: clippy reads the clippy.toml of the workspace root.

allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Proper names the docs cite (a format, a tool); ".." keeps clippy's default list.
doc-valid-idents = ["OpenMetrics", "ShellCheck", ".."]

# The exporter reads the wall clock through the injected Clock, so the tests can drive it with
# tokio's paused clock. The one direct read is clock::SystemClock, in rust-common, outside
# this lint's reach, so the exporter itself has no exemption. tokio::time::Instant::now stays
# allowed: it follows the paused clock.
disallowed-methods = [
    { path = "jiff::Timestamp::now", reason = "read the time from the injected Clock" },
    { path = "jiff::ZonedDateTime::now", reason = "read the time from the injected Clock" },
    { path = "std::time::SystemTime::now", reason = "read the time from the injected Clock" },
    { path = "std::time::Instant::now", reason = "read the time from the injected Clock" },
    # The exporter spawns no process; a test or the harness that runs a program says why.
    { path = "std::process::Command::new", reason = "the exporter spawns no process" },
    { path = "tokio::process::Command::new", reason = "the exporter spawns no process", allow-invalid = true },
]
