version: "2"

run:
  # The integration harness and suite only compile under this tag; without it they would never be
  # linted.
  build-tags:
    - integration

linters:
  default: all

  enable:
    - gomodguard_v2

  disable:
    - gomodguard
    - exhaustruct
    - exhaustruct_v5
    - gochecknoglobals
    - nonamedreturns
    - wsl

  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        logger:
          deny:
            - pkg: "github.com/sirupsen/logrus"
              desc: logging is allowed only via internal/logger (logger.L).
          files:
            # logrus is allowed to use only in the logger package.
            - "!**/internal/logger/**.go"
        forbidden-forks:
          deny:
            - pkg: "github.com/pkg/errors"
              desc: Should be replaced by standard lib errors package.
            - pkg: "github.com/instana/testify"
              desc: It's a fork of github.com/stretchr/testify.
        # The trailing slash is load-bearing: depguard matches a deny entry as a plain string
        # prefix, so without it the entries would also deny github.com/moby/term, moby/sys/* and
        # moby/docker-image-spec, which are not the SDK.
        docker-sdk-boundary:
          deny:
            - pkg: "github.com/docker/docker/"
              desc: >-
                the v28 Docker SDK, replaced by github.com/moby/moby and no longer a dependency;
                kept here so that, should it come back, it stays confined to internal/collector and
                cmd/swarm-scheduler-exporter like the SDK that replaced it.
            - pkg: "github.com/moby/moby/"
              desc: >-
                Docker SDK (github.com/moby/moby/client and api) access only in internal/collector
                (through the DockerAPI interface) and cmd/swarm-scheduler-exporter — keeps the
                exporter's Docker surface read-only.
          # internal/testenv and test/integration are the integration harness and suite: they
          # create, update and remove services, nodes and containers, but only in the throwaway
          # DinD Swarm each run brings up, and they are confined by the integration build tag, so
          # nothing in the exporter can import them. The exporter itself stays read-only.
          files:
            - "!**/internal/collector/**.go"
            - "!**/cmd/swarm-scheduler-exporter/**.go"
            - "!**/internal/testenv/**.go"
            - "!**/test/integration/**.go"
    dupl:
      threshold: 100
    funlen:
      lines: -1 # the number of lines (code + empty lines) is not a right metric and leads to code without empty line or one-liner.
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - ifElseChain
        - octalLiteral
        - whyNoLint
    gocognit:
      min-complexity: 35
    gocyclo:
      min-complexity: 15
    godox:
      keywords:
        - FIXME
    mnd:
      # don't include the "operation" and "assign"
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
      ignored-functions:
        - strings.SplitN
    govet:
      enable:
        - nilness
        - shadow
    errorlint:
      asserts: false
    lll:
      line-length: 140
    misspell:
      locale: US
      ignore-rules:
        - "importas" # linter name
    nolintlint:
      allow-unused: false # report any unused nolint directives
      require-explanation: true # require an explanation for nolint directives
      require-specific: true # require nolint directives to be specific about which linter is being skipped
    revive:
      rules:
        - name: indent-error-flow
        - name: unexported-return
          disabled: true
        - name: unused-parameter
        - name: unused-receiver

  exclusions:
    generated: lax # skip files containing "Code generated" magic comment
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      - path: (.+)_test\.go
        linters:
          - dupl
          - funlen
          - gocognit
          - goconst
          - gocyclo
          - lll
          - maintidx
          - mnd
          - paralleltest
          - testpackage
          - varnamelen
      - path: (.+)_test\.go
        linters:
          - cyclop
        text: "calculated cyclomatic complexity"
      - path: (.+)_test\.go
        linters:
          - errcheck
        text: "CloseNow"
      - path: (.+)_test\.go
        linters:
          - gosec
        text: "G101: Potential hardcoded credentials"

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/leinardi/swarm-scheduler-exporter)
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
    goimports:
      local-prefixes:
        - github.com/leinardi/swarm-scheduler-exporter
